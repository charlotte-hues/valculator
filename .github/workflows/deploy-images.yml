name: Deploy Images

on:
  workflow_dispatch:

concurrency: images

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare --activate

      - name: Setup OIDC Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: eu-west-1
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Install dependencies
        run: yarn install --immutable

      # One-time, in the AWS and GoDaddy consoles: request a DNS-validated
      # certificate in us-east-1 for images.valculator.io, add its validation
      # CNAME at GoDaddy, and save the certificate ARN as the repository
      # variable IMAGE_CERTIFICATE_ARN. After this job prints the CloudFront
      # domain, add a CNAME for images pointing at that domain. Leave both.
      - name: Deploy to AWS
        run: yarn deploy:images
        env:
          IMAGE_CERTIFICATE_ARN: ${{ vars.IMAGE_CERTIFICATE_ARN }}
